name: Consolidacao Mensal de Extratos

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

jobs:
  consolidar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-build-isolation --no-deps -e .

      - name: Preparar arquivos de entrada
        run: python scripts/preparar_entrada.py

      - name: Executar testes determinísticos
        run: pytest -m "not gemini" -v

      - name: Executar consolidação ponta a ponta
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m rpa_extratos --entrada entrada --saida saida --logs logs

      - name: Executar teste de aceitação completo com Gemini (quando chave configurada)
        if: ${{ env.GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest -m gemini -v

      - name: Publicar planilha consolidada e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidado-extratos-${{ github.run_number }}
          path: |
            saida/
            logs/
